name: monitor
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env: {SUPABASE_URL: "${{ secrets.SUPABASE_URL }}", SUPABASE_SECRET_KEY: "${{ secrets.SUPABASE_SECRET_KEY }}", RESEND_API_KEY: "${{ secrets.RESEND_API_KEY }}", ALERT_EMAIL: "${{ secrets.ALERT_EMAIL }}", TELEGRAM_BOT_TOKEN: "${{ secrets.TELEGRAM_BOT_TOKEN }}", TELEGRAM_CHAT_ID: "${{ secrets.TELEGRAM_CHAT_ID }}"}
    steps:
      - uses: actions/checkout@v4
      - run: node monitor.mjs
